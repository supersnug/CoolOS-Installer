name: Development package

on:
  push:
    branches:
      - cachyos
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: development-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out installer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build user
        run: |
          pacman -Syu --needed --noconfirm git sudo
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Arch package
        run: |
          runuser -u builder -- bash -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --syncdeps --noconfirm"
          mkdir -p dist
          packages=(packaging/cachyos-calamares-next-*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" dist/cachyos-calamares-next-x86_64.pkg.tar.zst

      - name: Publish rolling development package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: development
          name: Development package
          prerelease: true
          make_latest: false
          files: dist/cachyos-calamares-next-x86_64.pkg.tar.zst
