# SPDX-License-Identifier: CC0-1.0
#
# handling systemd on target.
---

units:
   - name: "NetworkManager"
     action: "enable"
     mandatory: false

   - name: "cups"
     action: "enable"
     mandatory: false

   - name: "avahi-daemon"
     action: "enable"
     mandatory: false

   - name: "systemd-timesyncd"
     action: "enable"
     mandatory: false

   - name: "vboxservice"
     action: "enable"
     mandatory: false

   - name: "vmtoolsd"
     action: "enable"
     mandatory: false

   - name: "vmware-vmblock-fuse"
     action: "enable"
     mandatory: false

   - name: "firewalld.service"
     action: "enable"
     mandatory: false

   - name: "zfs-import-cache"
     action: "enable"
     mandatory: false

   - name: "zfs-mount"
     action: "enable"
     mandatory: false

   - name: "zfs-import.target"
     action: "enable"
     mandatory: false

   - name: "zfs.target"
     action: "enable"
     mandatory: false

   - name: "fstrim.timer"
     action: "enable"
     mandatory: false

   - name:  "pacman-init"
     action: "disable"
     mandatory:  false

   - name: "multi-user.target"
     action: "disable"
     mandatory:  false

   - name: "bluetooth.service"
     action: "enable"
     mandatory: false

   - name: "ananicy-cpp.service"
     action: "enable"
     mandatory: false

   - name: "bpftune.service"
     action: "enable"
     mandatory: false

   - name: "docker.service"
     action: "enable"
     mandatory: false

   - name: "virtqemud.socket"
     action: "enable"
     mandatory: false

   - name: "pkgfile-update.timer"
     action: "enable"
     mandatory: false

   - name: "systemd-oomd.service"
     action: "disable"
     mandatory: false

   - name: "arch-update.timer"
     action: "enable"
     mandatory: false
     user: true

   - name: "psd.service"
     action: "enable"
     mandatory: false
     user: true
